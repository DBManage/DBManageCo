<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DB Manage — Projects</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f9;color:#172033}
header{background:linear-gradient(135deg,#0b1220,#18263d);color:white;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #10182818}
h1{margin:0;font-size:22px}.sub{color:#98a2b3;font-size:13px;margin-top:4px}
main{max-width:1200px;margin:26px auto;padding:0 18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.summary-box{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:16px 18px;box-shadow:0 4px 16px #1018280b}.summary-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#667085}.summary-total{font-size:30px;font-weight:850;line-height:1.1;margin-top:7px;color:#101828}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.column{background:#eef2f7;border-radius:16px;padding:14px;min-height:220px}
.column h2{font-size:14px;margin:2px 2px 12px;display:flex;justify-content:space-between}
.count{background:#dfe5ed;border-radius:20px;padding:2px 8px;font-size:12px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:0 2px 7px #1018280d}
.name{font-weight:800;font-size:16px}.type{display:inline-block;margin-top:9px;background:#f2f4f7;border-radius:7px;padding:5px 8px;font-size:12px;color:#475467}
.actions{display:flex;gap:6px;margin-top:12px}.actions button{font-size:12px;padding:7px 9px}
.empty{color:#98a2b3;font-size:13px;text-align:center;padding:30px 5px}
.modal{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}.box{background:white;border-radius:18px;padding:22px;max-width:430px;width:100%}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;background:white}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:980px){.summary{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.summary{grid-template-columns:1fr}.board{grid-template-columns:1fr}.column{min-height:100px}header{padding:18px}.board{gap:12px}}

.vinyl-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.nav-btn{background:#fff;border:1px solid #d0d5dd;color:#344054}
.nav-btn.active{background:#111827;color:#fff;border-color:#111827}
.page{display:none}.page.active{display:block}
.vinyl-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.vinyl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vinyl-card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:17px;box-shadow:0 3px 12px #1018280b}
.vinyl-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.vinyl-color{font-weight:850;font-size:17px}
.vinyl-swatch{width:24px;height:24px;border-radius:7px;border:1px solid #d0d5dd;flex:none}
.vinyl-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.vinyl-stat{background:#f8fafc;border-radius:10px;padding:11px}
.vinyl-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#667085;font-weight:800}
.vinyl-value{font-size:20px;font-weight:850;margin-top:3px}
.vinyl-actions{display:flex;gap:7px;margin-top:13px}
.vinyl-actions button{font-size:12px;padding:7px 9px}
.vinyl-low{color:#b42318}
.vinyl-empty{background:#fff;border:1px dashed #d0d5dd;border-radius:16px;padding:45px;text-align:center;color:#667085}
.amount-help{font-size:13px;color:#667085;line-height:1.45;margin-top:6px}
@media(max-width:980px){.vinyl-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.vinyl-grid{grid-template-columns:1fr}.vinyl-meta{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<header>
<div><h1>DB Manage</h1><div class="sub">Clients & Projects</div></div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
  <span id="syncStatus" style="font-size:12px;color:#98a2b3">Not connected</span>
  <button class="secondary" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
  <button class="primary" id="newProjectBtn" style="display:none" onclick="openModal()">+ New Project</button>
</div>
</header>
<div id="authScreen" style="max-width:430px;margin:55px auto;padding:0 18px">
  <div class="box" style="box-shadow:0 8px 30px #10182814;border:1px solid #e5e9f0">
    <h2 style="margin:0">DB Manage Login</h2>
    <p style="color:#667085;font-size:13px;line-height:1.5">Sign in on your phone and computer with the same account. Your projects will be stored in one shared database.</p>
    <label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Password">
    <div class="modal-actions" style="justify-content:stretch">
      <button class="primary" style="flex:1" onclick="signIn()">Sign In</button>
      <button class="secondary" style="flex:1" onclick="signUp()">Create Account</button>
    </div>
    <div id="authMessage" style="margin-top:12px;font-size:13px;color:#667085"></div>
  </div>
</div>
<main id="appMain" style="display:none">
<div class="vinyl-nav">
  <button id="projectsTab" class="nav-btn active" onclick="showPage('projects')">Projects</button>
  <button id="vinylTab" class="nav-btn" onclick="showPage('vinyl')">Vinyl Management</button>
</div>

<section id="projectsPage" class="page active">
  <div class="summary"><div class="summary-box"><div class="summary-label">Create Design</div><div class="summary-total" id="totalCreate">0</div></div><div class="summary-box"><div class="summary-label">Start Printing</div><div class="summary-total" id="totalPrint">0</div></div><div class="summary-box"><div class="summary-label">In Progress</div><div class="summary-total" id="totalProgress">0</div></div><div class="summary-box"><div class="summary-label">Done</div><div class="summary-total" id="totalDone">0</div></div></div>
  <div class="toolbar"><button class="secondary" onclick="clearAll()">Clear all projects</button></div>
  <div class="board" id="board"></div>
</section>

<section id="vinylPage" class="page">
  <div class="vinyl-toolbar">
    <button class="primary" onclick="openVinylModal()">+ Add Vinyl Roll</button>
    <button class="secondary" onclick="refreshVinyl()">Refresh</button>
  </div>
  <div class="vinyl-grid" id="vinylGrid"></div>
</section>
</main>


<div class="modal" id="vinylModal"><div class="box">
<h2 style="margin:0">Add Vinyl Roll</h2>
<label>Vinyl color</label><input id="vinylColor" placeholder="Example: Gloss Black">
<label>Roll length (yards)</label><input id="vinylLength" type="number" min="0" step="0.01" placeholder="Example: 10">
<label>Currently remaining (yards)</label><input id="vinylRemaining" type="number" min="0" step="0.01" placeholder="Example: 10">
<label>Color swatch</label><input id="vinylSwatch" type="color" value="#111111" style="height:46px;padding:5px">
<div class="modal-actions"><button class="secondary" onclick="closeVinylModal()">Cancel</button><button class="primary" onclick="addVinyl()">Add Vinyl</button></div>
</div></div>

<div class="modal" id="vinylUseModal"><div class="box">
<h2 style="margin:0">Enter Printed Amount</h2>
<div id="vinylUseTitle" class="amount-help"></div>
<label>Amount printed / used (yards)</label>
<input id="vinylUseAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Example: 2.5">
<div id="vinylUseRemaining" class="amount-help"></div>
<div class="modal-actions"><button class="secondary" onclick="closeVinylUseModal()">Cancel</button><button class="primary" onclick="saveVinylUse()">Save Amount</button></div>
</div></div>

<div class="modal" id="vinylEditModal"><div class="box">
<h2 style="margin:0">Edit Vinyl Roll</h2>
<div id="vinylEditTitle" class="amount-help"></div>
<label>Remaining (yards)</label>
<input id="vinylEditRemaining" type="number" min="0" step="0.01" inputmode="decimal">
<div class="modal-actions"><button class="secondary" onclick="closeVinylEditModal()">Cancel</button><button class="primary" onclick="saveVinylEdit()">Save Changes</button></div>
</div></div>

<div class="modal" id="modal"><div class="box">
<h2 style="margin:0">New Project</h2>
<label>Client name</label><input id="client" placeholder="Enter client name">
<label>Vehicle</label><select id="vehicle"><option>Van</option><option>Truck</option><option>Box truck</option><option>Door graphics</option></select>
<label>Vehicle Type</label><input id="vehicleType" placeholder="Make / model">
<label>Due date</label><input id="dueDate" type="date">
<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addProject()">Add Project</button></div>
</div></div>


<script>
/*
  DB Manage — shared cloud version
  1) Create a Supabase project.
  2) Run the SQL in supabase-setup.sql.
  3) Put your Project URL and Publishable/Anon key below.
*/
const SUPABASE_URL = "https://jxewdbxjozocitzgvuut.supabase.co";
const SUPABASE_KEY = "sb_publishable_emtZOO9qjOKoVNVZWzyLCg_Mm6waGc5";

const statuses=["Create Design","Start Printing","In Progress","Done"];
const localKey = "divineProjects";
let projects = [];
let currentUser = null;
let realtimeChannel = null;

const supabaseConfigured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_YOUR") &&
  !SUPABASE_KEY.includes("PASTE_YOUR");

const supabaseClient = supabaseConfigured
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;

function setSyncStatus(text, good=false){
  const el=document.getElementById("syncStatus");
  el.textContent=text;
  el.style.color=good ? "#12b76a" : "#98a2b3";
}

function showAuthMessage(text, error=false){
  const el=document.getElementById("authMessage");
  el.textContent=text;
  el.style.color=error ? "#b42318" : "#667085";
}

function showApp(){
  document.getElementById("authScreen").style.display="none";
  document.getElementById("appMain").style.display="block";
  document.getElementById("newProjectBtn").style.display="inline-block";
  document.getElementById("logoutBtn").style.display="inline-block";
}

function showAuth(){
  document.getElementById("authScreen").style.display="block";
  document.getElementById("appMain").style.display="none";
  document.getElementById("newProjectBtn").style.display="none";
  document.getElementById("logoutBtn").style.display="none";
}

async function signIn(){
  if(!supabaseClient){ return showAuthMessage("Add your Supabase URL and key to the file first.", true); }
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email || !password) return showAuthMessage("Enter your email and password.", true);
  showAuthMessage("Signing in...");
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) showAuthMessage(error.message,true);
}

async function signUp(){
  if(!supabaseClient){ return showAuthMessage("Add your Supabase URL and key to the file first.", true); }
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email || !password) return showAuthMessage("Enter an email and password.", true);
  if(password.length < 6) return showAuthMessage("Use a password with at least 6 characters.", true);
  showAuthMessage("Creating your account...");
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error) return showAuthMessage(error.message,true);
  if(data.session) {
    showAuthMessage("Account created.");
  } else {
    showAuthMessage("Account created. Check your email if confirmation is required, then sign in.");
  }
}

async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
}

async function loadProjects(){
  if(!currentUser) return;
  setSyncStatus("Syncing…");
  const {data,error}=await supabaseClient
    .from("projects")
    .select("id,client,vehicle,vehicle_type,due_date,status,created_at,updated_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    setSyncStatus("Sync error");
    return;
  }

  projects=(data||[]).map(p=>({
    id:Number(p.id),
    client:p.client,
    vehicle:p.vehicle,
    vehicleType:p.vehicle_type || "",
    dueDate:p.due_date || "",
    status:p.status
  }));

  localStorage.setItem(localKey,JSON.stringify(projects));
  render();
  setSyncStatus("Synced ✓",true);
}

async function migrateLocalProjects(){
  const raw=localStorage.getItem(localKey);
  if(!raw) return;
  let local=[];
  try { local=JSON.parse(raw)||[]; } catch(e) { return; }
  if(!local.length) return;

  // Only offer migration when the shared database is empty.
  const {count,error}=await supabaseClient
    .from("projects")
    .select("id",{count:"exact",head:true})
    .eq("user_id",currentUser.id);

  if(error || count !== 0) return;

  const rows=local.map(p=>({
    id:Number(p.id)||Date.now()+Math.floor(Math.random()*100000),
    user_id:currentUser.id,
    client:p.client||"",
    vehicle:p.vehicle||"Van",
    vehicle_type:p.vehicleType||"",
    due_date:p.dueDate||null,
    status:p.status||"Create Design"
  })).filter(p=>p.client);

  if(!rows.length) return;

  const {error:insertError}=await supabaseClient.from("projects").insert(rows);
  if(insertError){
    console.error(insertError);
    alert("Your old local projects could not be migrated: "+insertError.message);
    return;
  }
  localStorage.removeItem(localKey);
}

async function addProject(){
  const client=document.getElementById("client").value.trim();
  if(!client)return alert("Enter a client name.");

  const row={
    id:Date.now(),
    user_id:currentUser.id,
    client,
    vehicle:document.getElementById("vehicle").value,
    vehicle_type:document.getElementById("vehicleType").value.trim(),
    due_date:document.getElementById("dueDate").value || null,
    status:"Create Design"
  };

  const {error}=await supabaseClient.from("projects").insert(row);
  if(error){ alert("Could not save project: "+error.message); return; }

  closeModal();
  document.getElementById("client").value="";
  document.getElementById("vehicleType").value="";
  document.getElementById("dueDate").value="";
  await loadProjects();
}

async function move(id,status){
  const {error}=await supabaseClient
    .from("projects")
    .update({status,updated_at:new Date().toISOString()})
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not update project: "+error.message); return; }
  await loadProjects();
}

async function remove(id){
  if(!confirm("Delete this project?")) return;
  const {error}=await supabaseClient
    .from("projects")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not delete project: "+error.message); return; }
  await loadProjects();
}

async function clearAll(){
  if(!projects.length || !confirm("Delete all projects?")) return;
  const {error}=await supabaseClient
    .from("projects")
    .delete()
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not clear projects: "+error.message); return; }
  await loadProjects();
}

function openModal(){document.getElementById("modal").classList.add("open");document.getElementById("client").focus()}
function closeModal(){document.getElementById("modal").classList.remove("open")}

function render(){
  document.getElementById("totalCreate").textContent=projects.filter(p=>p.status==="Create Design").length;
  document.getElementById("totalPrint").textContent=projects.filter(p=>p.status==="Start Printing").length;
  document.getElementById("totalProgress").textContent=projects.filter(p=>p.status==="In Progress").length;
  document.getElementById("totalDone").textContent=projects.filter(p=>p.status==="Done").length;

  const board=document.getElementById("board");
  board.innerHTML="";

  statuses.forEach(s=>{
    const col=document.createElement("section");
    col.className="column";
    const items=projects.filter(p=>p.status===s);
    col.innerHTML=`<h2>${s}<span class="count">${items.length}</span></h2>`;
    if(!items.length)col.innerHTML+=`<div class="empty">No projects here</div>`;

    items.forEach(p=>{
      const card=document.createElement("div");
      card.className="card";
      card.innerHTML=`<div class="name">${esc(p.client)}</div><div class="type">${esc(p.vehicle)}${p.vehicleType?" · "+esc(p.vehicleType):""}</div>${p.dueDate?`<div style="margin-top:8px;font-size:12px;color:#667085">Due: ${new Date(p.dueDate+"T00:00:00").toLocaleDateString()}</div>`:""}
      <div class="actions">
        ${s!=="Create Design"?`<button class="secondary" onclick="move(${p.id},'Create Design')">← Design</button>`:""}
        ${s==="Create Design"?`<button class="secondary" onclick="move(${p.id},'Start Printing')">Start Printing →</button>`:""}
        ${s==="Start Printing"?`<button class="secondary" onclick="move(${p.id},'In Progress')">In Progress →</button>`:""}
        ${s==="In Progress"?`<button class="secondary" onclick="move(${p.id},'Done')">Done →</button>`:""}
        <button class="secondary" onclick="remove(${p.id})">Delete</button>
      </div>`;
      col.appendChild(card);
    });
    board.appendChild(col);
  });
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function startApp(){
  if(!supabaseConfigured){
    showAuth();
    showAuthMessage("This copy is ready for Supabase. Open the setup guide, add your Project URL and Publishable/Anon key, then reload.",true);
    return;
  }

  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session) await onSignedIn(session);

  supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
    if(session) {
      // Defer database work so auth state handling stays responsive.
      setTimeout(()=>onSignedIn(session),0);
    } else {
      currentUser=null;
      if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel=null;
      projects=[];
      render();
      showAuth();
      setSyncStatus("Not connected");
    }
  });
}

async function onSignedIn(session){
  currentUser=session.user;
  showApp();
  setSyncStatus("Connecting…");
  await migrateLocalProjects();
  await loadProjects();
  await loadVinyl();

  if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);

  realtimeChannel=supabaseClient
    .channel("db-manage-projects")
    .on("postgres_changes",{
      event:"*", schema:"public", table:"projects", filter:`user_id=eq.${currentUser.id}`
    },async ()=>{ await loadProjects(); })
    .on("postgres_changes",{
      event:"*", schema:"public", table:"vinyl_rolls", filter:`user_id=eq.${currentUser.id}`
    },async ()=>{ await loadVinyl(); })
    .subscribe((status)=>{
      if(status==="SUBSCRIBED") setSyncStatus("Live sync ✓",true);
    });
}


/* Vinyl Management
   Inventory is stored in this browser's localStorage so this feature stays
   inside this single HTML file and does not require a new Supabase table.
*/
const vinylTable = "vinyl_rolls";
let vinylRolls = [];

function yardsToInches(y){ return Number(y) * 36; }
function inchesToYards(i){ return Number(i) / 36; }

async function loadVinyl(){
  if(!currentUser) return;
  const {data,error}=await supabaseClient
    .from(vinylTable)
    .select("id,color,roll_length_inches,remaining_inches,swatch,created_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:true});
  if(error){
    console.error(error);
    alert("Could not load vinyl rolls: " + error.message);
    return;
  }
  vinylRolls=(data||[]).map(r=>({
    id:String(r.id), color:r.color,
    rollLength:inchesToYards(r.roll_length_inches),
    remaining:inchesToYards(r.remaining_inches),
    swatch:r.swatch || "#111111",
    createdAt:r.created_at
  }));
  renderVinyl();
}

async function saveVinylRoll(roll){
  const row={
    user_id:currentUser.id,
    color:roll.color,
    roll_length_inches:yardsToInches(roll.rollLength),
    remaining_inches:yardsToInches(roll.remaining),
    swatch:roll.swatch || "#111111"
  };
  const {data,error}=await supabaseClient.from(vinylTable).insert(row).select("id").single();
  if(error){ alert("Could not save vinyl roll: " + error.message); return false; }
  roll.id=data.id;
  return true;
}

function showPage(page){
  const projectsPage=document.getElementById("projectsPage");
  const vinylPage=document.getElementById("vinylPage");
  const projectsTab=document.getElementById("projectsTab");
  const vinylTab=document.getElementById("vinylTab");
  const isVinyl=page==="vinyl";
  projectsPage.classList.toggle("active",!isVinyl);
  vinylPage.classList.toggle("active",isVinyl);
  projectsTab.classList.toggle("active",!isVinyl);
  vinylTab.classList.toggle("active",isVinyl);
  if(isVinyl) loadVinyl();
}

function openVinylModal(){
  document.getElementById("vinylColor").value="";
  document.getElementById("vinylLength").value="";
  document.getElementById("vinylRemaining").value="";
  document.getElementById("vinylSwatch").value="#111111";
  document.getElementById("vinylModal").classList.add("open");
  document.getElementById("vinylColor").focus();
}
function closeVinylModal(){document.getElementById("vinylModal").classList.remove("open")}

async function addVinyl(){
  const color=document.getElementById("vinylColor").value.trim();
  const length=parseFloat(document.getElementById("vinylLength").value);
  const remainingRaw=document.getElementById("vinylRemaining").value;
  const remaining=remainingRaw==="" ? length : parseFloat(remainingRaw);
  const swatch=document.getElementById("vinylSwatch").value || "#111111";
  if(!color) return alert("Enter a vinyl color.");
  if(!Number.isFinite(length) || length<=0) return alert("Enter a valid roll length.");
  if(!Number.isFinite(remaining) || remaining<0 || remaining>length) return alert("Remaining amount must be between 0 and the roll length.");
  const roll={color,rollLength:length,remaining,swatch};
  if(await saveVinylRoll(roll)){
    closeVinylModal();
    await loadVinyl();
  }
}

async function updateVinylRoll(roll){
  const {error}=await supabaseClient.from(vinylTable)
    .update({
      remaining_inches:yardsToInches(roll.remaining),
      color:roll.color,
      roll_length_inches:yardsToInches(roll.rollLength),
      swatch:roll.swatch || "#111111",
      updated_at:new Date().toISOString()
    })
    .eq("id",roll.id)
    .eq("user_id",currentUser.id);
  if(error){ alert("Could not update vinyl roll: " + error.message); return false; }
  return true;
}

let vinylUseRollId=null;
let vinylEditRollId=null;

async function getVinylRollById(id){
  if(!currentUser || !id) return null;
  const {data,error}=await supabaseClient
    .from(vinylTable)
    .select("id,color,roll_length_inches,remaining_inches,swatch,created_at")
    .eq("id",String(id))
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Vinyl lookup error:",error);
    alert("Could not find that vinyl roll: " + error.message);
    return null;
  }
  if(!data) return null;

  return {
    id:String(data.id),
    color:data.color,
    rollLength:inchesToYards(data.roll_length_inches),
    remaining:inchesToYards(data.remaining_inches),
    swatch:data.swatch || "#111111",
    createdAt:data.created_at
  };
}

async function openVinylUseModal(id){
  const roll=await getVinylRollById(id);
  if(!roll) return alert("Could not find that vinyl roll. Please refresh Vinyl Management and try again.");
  vinylUseRollId=String(roll.id);
  document.getElementById("vinylUseTitle").textContent=`${roll.color} • ${formatYards(roll.remaining)} yd currently remaining`;
  document.getElementById("vinylUseAmount").value="";
  document.getElementById("vinylUseRemaining").textContent="Enter the amount you printed. The remaining balance will be updated automatically.";
  document.getElementById("vinylUseModal").classList.add("open");
  setTimeout(()=>document.getElementById("vinylUseAmount").focus(),50);
}
function closeVinylUseModal(){document.getElementById("vinylUseModal").classList.remove("open");vinylUseRollId=null;}

async function saveVinylUse(){
  const button=document.querySelector('#vinylUseModal .primary');
  const amount=parseFloat(document.getElementById("vinylUseAmount").value);
  if(!Number.isFinite(amount) || amount<=0) return alert("Enter a valid printed amount greater than 0.");

  button.disabled=true; button.textContent="Saving…";
  try{
    // Fetch the latest copy from Supabase instead of relying on a possibly stale
    // browser array. This prevents the "Could not find that vinyl roll" problem
    // when realtime refreshes replace vinylRolls while the modal is being used.
    const roll=await getVinylRollById(vinylUseRollId);
    if(!roll) return;
    if(amount>roll.remaining) return alert(`You only have ${formatYards(roll.remaining)} yd remaining on this roll.`);

    const updated={...roll,remaining:Math.max(0,roll.remaining-amount)};
    if(await updateVinylRoll(updated)){
      closeVinylUseModal();
      await loadVinyl();
    }
  }finally{
    button.disabled=false;
    button.textContent="Save Amount";
  }
}

function openVinylEditModal(id){
  const roll=vinylRolls.find(r=>String(r.id)===String(id));
  if(!roll) return alert("Could not find that vinyl roll.");
  vinylEditRollId=id;
  document.getElementById("vinylEditTitle").textContent=`${roll.color} • Original roll: ${formatYards(roll.rollLength)} yd`;
  document.getElementById("vinylEditRemaining").value=roll.remaining;
  document.getElementById("vinylEditModal").classList.add("open");
  setTimeout(()=>document.getElementById("vinylEditRemaining").focus(),50);
}
function closeVinylEditModal(){document.getElementById("vinylEditModal").classList.remove("open");vinylEditRollId=null;}
async function saveVinylEdit(){
  const roll=vinylRolls.find(r=>String(r.id)===String(vinylEditRollId));
  if(!roll) return alert("Could not find that vinyl roll.");
  const remaining=parseFloat(document.getElementById("vinylEditRemaining").value);
  if(!Number.isFinite(remaining) || remaining<0 || remaining>roll.rollLength) return alert("Enter a valid amount between 0 and the original roll length.");
  const updated={...roll,remaining};
  const button=document.querySelector('#vinylEditModal .primary');
  button.disabled=true; button.textContent="Saving…";
  try{if(await updateVinylRoll(updated)){closeVinylEditModal();await loadVinyl();}}finally{button.disabled=false;button.textContent="Save Changes";}
}

async function removeVinyl(id){
  const roll=vinylRolls.find(r=>String(r.id)===String(id));
  if(!roll) return;
  if(!confirm(`Delete the ${roll.color} vinyl roll?`)) return;
  const {error}=await supabaseClient.from(vinylTable)
    .delete().eq("id",id).eq("user_id",currentUser.id);
  if(error){ alert("Could not delete vinyl roll: " + error.message); return; }
  await loadVinyl();
}

function refreshVinyl(){loadVinyl()}

function formatYards(n){
  const x=Number(n)||0;
  return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}

function renderVinyl(){
  const grid=document.getElementById("vinylGrid");
  if(!grid) return;
  if(!vinylRolls.length){
    grid.innerHTML='<div class="vinyl-empty" style="grid-column:1/-1"><strong>No vinyl rolls yet.</strong><div style="margin-top:7px">Add your first roll to start tracking your inventory.</div></div>';
    return;
  }
  grid.innerHTML="";
  vinylRolls.forEach(r=>{
    const pct=r.rollLength ? Math.max(0,Math.min(100,(r.remaining/r.rollLength)*100)) : 0;
    const card=document.createElement("div");
    card.className="vinyl-card";
    card.innerHTML=`
      <div class="vinyl-head">
        <div style="display:flex;align-items:center;gap:9px">
          <span class="vinyl-swatch" style="background:${esc(r.swatch)}"></span>
          <div class="vinyl-color">${esc(r.color)}</div>
        </div>
        <div style="font-size:12px;color:#667085">${formatYards(pct)}%</div>
      </div>
      <div style="height:8px;background:#eaecf0;border-radius:20px;margin-top:14px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${esc(r.swatch)};border-radius:20px"></div>
      </div>
      <div class="vinyl-meta">
        <div class="vinyl-stat"><div class="vinyl-label">Roll length</div><div class="vinyl-value">${formatYards(r.rollLength)} yd</div></div>
        <div class="vinyl-stat"><div class="vinyl-label">Remaining</div><div class="vinyl-value ${r.remaining<=0?'vinyl-low':''}">${formatYards(r.remaining)} yd</div></div>
      </div>
      <div class="vinyl-actions">
        <button class="primary" onclick="openVinylUseModal('${String(r.id).replace(/'/g,"\\'")}')">Enter Printed Amount</button>
        <button class="secondary" onclick="openVinylEditModal('${String(r.id).replace(/'/g,"\\'")}')">Edit</button>
        <button class="secondary" onclick="removeVinyl('${String(r.id).replace(/'/g,"\\'")}')">Delete</button>
      </div>`;
    grid.appendChild(card);
  });
}

render();
startApp();
</script>

</body></html>
