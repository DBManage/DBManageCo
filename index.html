<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DB Manage — Projects</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f9;color:#172033}
header{background:linear-gradient(135deg,#0b1220,#18263d);color:white;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px #10182818}
h1{margin:0;font-size:22px}.sub{color:#98a2b3;font-size:13px;margin-top:4px}
main{max-width:1200px;margin:26px auto;padding:0 18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.summary-box{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:16px 18px;box-shadow:0 4px 16px #1018280b}.summary-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#667085}.summary-total{font-size:30px;font-weight:850;line-height:1.1;margin-top:7px;color:#101828}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.column{background:#eef2f7;border-radius:16px;padding:14px;min-height:220px}
.column h2{font-size:14px;margin:2px 2px 12px;display:flex;justify-content:space-between}
.count{background:#dfe5ed;border-radius:20px;padding:2px 8px;font-size:12px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:0 2px 7px #1018280d}
.name{font-weight:800;font-size:16px}.type{display:inline-block;margin-top:9px;background:#f2f4f7;border-radius:7px;padding:5px 8px;font-size:12px;color:#475467}
.actions{display:flex;gap:6px;margin-top:12px}.actions button{font-size:12px;padding:7px 9px}
.empty{color:#98a2b3;font-size:13px;text-align:center;padding:30px 5px}
.modal{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}.box{background:white;border-radius:18px;padding:22px;max-width:430px;width:100%}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;background:white}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:980px){.summary{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.summary{grid-template-columns:1fr}.board{grid-template-columns:1fr}.column{min-height:100px}header{padding:18px}.board{gap:12px}}
</style>
</head>
<body>
<header>
<div><h1>DB Manage</h1><div class="sub">Clients & Projects</div></div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
  <span id="syncStatus" style="font-size:12px;color:#98a2b3">Not connected</span>
  <button class="secondary" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
  <button class="primary" id="newProjectBtn" style="display:none" onclick="openModal()">+ New Project</button>
</div>
</header>
<div id="authScreen" style="max-width:430px;margin:55px auto;padding:0 18px">
  <div class="box" style="box-shadow:0 8px 30px #10182814;border:1px solid #e5e9f0">
    <h2 style="margin:0">DB Manage Login</h2>
    <p style="color:#667085;font-size:13px;line-height:1.5">Sign in on your phone and computer with the same account. Your projects will be stored in one shared database.</p>
    <label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Password">
    <div class="modal-actions" style="justify-content:stretch">
      <button class="primary" style="flex:1" onclick="signIn()">Sign In</button>
      <button class="secondary" style="flex:1" onclick="signUp()">Create Account</button>
    </div>
    <div id="authMessage" style="margin-top:12px;font-size:13px;color:#667085"></div>
  </div>
</div>
<main id="appMain" style="display:none">
<div class="summary"><div class="summary-box"><div class="summary-label">Create Design</div><div class="summary-total" id="totalCreate">0</div></div><div class="summary-box"><div class="summary-label">Start Printing</div><div class="summary-total" id="totalPrint">0</div></div><div class="summary-box"><div class="summary-label">In Progress</div><div class="summary-total" id="totalProgress">0</div></div><div class="summary-box"><div class="summary-label">Done</div><div class="summary-total" id="totalDone">0</div></div></div>
<div class="toolbar"><button class="secondary" onclick="clearAll()">Clear all projects</button></div>
<div class="board" id="board"></div>
</main>

<div class="modal" id="modal"><div class="box">
<h2 style="margin:0">New Project</h2>
<label>Client name</label><input id="client" placeholder="Enter client name">
<label>Vehicle</label><select id="vehicle"><option>Van</option><option>Truck</option><option>Box truck</option><option>Door graphics</option></select>
<label>Vehicle Type</label><input id="vehicleType" placeholder="Make / model">
<label>Due date</label><input id="dueDate" type="date">
<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="addProject()">Add Project</button></div>
</div></div>


<script>
/*
  DB Manage — shared cloud version
  1) Create a Supabase project.
  2) Run the SQL in supabase-setup.sql.
  3) Put your Project URL and Publishable/Anon key below.
*/
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";

const statuses=["Create Design","Start Printing","In Progress","Done"];
const localKey = "divineProjects";
let projects = [];
let currentUser = null;
let realtimeChannel = null;

const supabaseConfigured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_YOUR") &&
  !SUPABASE_KEY.includes("PASTE_YOUR");

const supabaseClient = supabaseConfigured
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;

function setSyncStatus(text, good=false){
  const el=document.getElementById("syncStatus");
  el.textContent=text;
  el.style.color=good ? "#12b76a" : "#98a2b3";
}

function showAuthMessage(text, error=false){
  const el=document.getElementById("authMessage");
  el.textContent=text;
  el.style.color=error ? "#b42318" : "#667085";
}

function showApp(){
  document.getElementById("authScreen").style.display="none";
  document.getElementById("appMain").style.display="block";
  document.getElementById("newProjectBtn").style.display="inline-block";
  document.getElementById("logoutBtn").style.display="inline-block";
}

function showAuth(){
  document.getElementById("authScreen").style.display="block";
  document.getElementById("appMain").style.display="none";
  document.getElementById("newProjectBtn").style.display="none";
  document.getElementById("logoutBtn").style.display="none";
}

async function signIn(){
  if(!supabaseClient){ return showAuthMessage("Add your Supabase URL and key to the file first.", true); }
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email || !password) return showAuthMessage("Enter your email and password.", true);
  showAuthMessage("Signing in...");
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) showAuthMessage(error.message,true);
}

async function signUp(){
  if(!supabaseClient){ return showAuthMessage("Add your Supabase URL and key to the file first.", true); }
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email || !password) return showAuthMessage("Enter an email and password.", true);
  if(password.length < 6) return showAuthMessage("Use a password with at least 6 characters.", true);
  showAuthMessage("Creating your account...");
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error) return showAuthMessage(error.message,true);
  if(data.session) {
    showAuthMessage("Account created.");
  } else {
    showAuthMessage("Account created. Check your email if confirmation is required, then sign in.");
  }
}

async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
}

async function loadProjects(){
  if(!currentUser) return;
  setSyncStatus("Syncing…");
  const {data,error}=await supabaseClient
    .from("projects")
    .select("id,client,vehicle,vehicle_type,due_date,status,created_at,updated_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    setSyncStatus("Sync error");
    return;
  }

  projects=(data||[]).map(p=>({
    id:Number(p.id),
    client:p.client,
    vehicle:p.vehicle,
    vehicleType:p.vehicle_type || "",
    dueDate:p.due_date || "",
    status:p.status
  }));

  localStorage.setItem(localKey,JSON.stringify(projects));
  render();
  setSyncStatus("Synced ✓",true);
}

async function migrateLocalProjects(){
  const raw=localStorage.getItem(localKey);
  if(!raw) return;
  let local=[];
  try { local=JSON.parse(raw)||[]; } catch(e) { return; }
  if(!local.length) return;

  // Only offer migration when the shared database is empty.
  const {count,error}=await supabaseClient
    .from("projects")
    .select("id",{count:"exact",head:true})
    .eq("user_id",currentUser.id);

  if(error || count !== 0) return;

  const rows=local.map(p=>({
    id:Number(p.id)||Date.now()+Math.floor(Math.random()*100000),
    user_id:currentUser.id,
    client:p.client||"",
    vehicle:p.vehicle||"Van",
    vehicle_type:p.vehicleType||"",
    due_date:p.dueDate||null,
    status:p.status||"Create Design"
  })).filter(p=>p.client);

  if(!rows.length) return;

  const {error:insertError}=await supabaseClient.from("projects").insert(rows);
  if(insertError){
    console.error(insertError);
    alert("Your old local projects could not be migrated: "+insertError.message);
    return;
  }
  localStorage.removeItem(localKey);
}

async function addProject(){
  const client=document.getElementById("client").value.trim();
  if(!client)return alert("Enter a client name.");

  const row={
    id:Date.now(),
    user_id:currentUser.id,
    client,
    vehicle:document.getElementById("vehicle").value,
    vehicle_type:document.getElementById("vehicleType").value.trim(),
    due_date:document.getElementById("dueDate").value || null,
    status:"Create Design"
  };

  const {error}=await supabaseClient.from("projects").insert(row);
  if(error){ alert("Could not save project: "+error.message); return; }

  closeModal();
  document.getElementById("client").value="";
  document.getElementById("vehicleType").value="";
  document.getElementById("dueDate").value="";
  await loadProjects();
}

async function move(id,status){
  const {error}=await supabaseClient
    .from("projects")
    .update({status,updated_at:new Date().toISOString()})
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not update project: "+error.message); return; }
  await loadProjects();
}

async function remove(id){
  if(!confirm("Delete this project?")) return;
  const {error}=await supabaseClient
    .from("projects")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not delete project: "+error.message); return; }
  await loadProjects();
}

async function clearAll(){
  if(!projects.length || !confirm("Delete all projects?")) return;
  const {error}=await supabaseClient
    .from("projects")
    .delete()
    .eq("user_id",currentUser.id);

  if(error){ alert("Could not clear projects: "+error.message); return; }
  await loadProjects();
}

function openModal(){document.getElementById("modal").classList.add("open");document.getElementById("client").focus()}
function closeModal(){document.getElementById("modal").classList.remove("open")}

function render(){
  document.getElementById("totalCreate").textContent=projects.filter(p=>p.status==="Create Design").length;
  document.getElementById("totalPrint").textContent=projects.filter(p=>p.status==="Start Printing").length;
  document.getElementById("totalProgress").textContent=projects.filter(p=>p.status==="In Progress").length;
  document.getElementById("totalDone").textContent=projects.filter(p=>p.status==="Done").length;

  const board=document.getElementById("board");
  board.innerHTML="";

  statuses.forEach(s=>{
    const col=document.createElement("section");
    col.className="column";
    const items=projects.filter(p=>p.status===s);
    col.innerHTML=`<h2>${s}<span class="count">${items.length}</span></h2>`;
    if(!items.length)col.innerHTML+=`<div class="empty">No projects here</div>`;

    items.forEach(p=>{
      const card=document.createElement("div");
      card.className="card";
      card.innerHTML=`<div class="name">${esc(p.client)}</div><div class="type">${esc(p.vehicle)}${p.vehicleType?" · "+esc(p.vehicleType):""}</div>${p.dueDate?`<div style="margin-top:8px;font-size:12px;color:#667085">Due: ${new Date(p.dueDate+"T00:00:00").toLocaleDateString()}</div>`:""}
      <div class="actions">
        ${s!=="Create Design"?`<button class="secondary" onclick="move(${p.id},'Create Design')">← Design</button>`:""}
        ${s==="Create Design"?`<button class="secondary" onclick="move(${p.id},'Start Printing')">Start Printing →</button>`:""}
        ${s==="Start Printing"?`<button class="secondary" onclick="move(${p.id},'In Progress')">In Progress →</button>`:""}
        ${s==="In Progress"?`<button class="secondary" onclick="move(${p.id},'Done')">Done →</button>`:""}
        <button class="secondary" onclick="remove(${p.id})">Delete</button>
      </div>`;
      col.appendChild(card);
    });
    board.appendChild(col);
  });
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function startApp(){
  if(!supabaseConfigured){
    showAuth();
    showAuthMessage("This copy is ready for Supabase. Open the setup guide, add your Project URL and Publishable/Anon key, then reload.",true);
    return;
  }

  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session) await onSignedIn(session);

  supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
    if(session) {
      // Defer database work so auth state handling stays responsive.
      setTimeout(()=>onSignedIn(session),0);
    } else {
      currentUser=null;
      if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel=null;
      projects=[];
      render();
      showAuth();
      setSyncStatus("Not connected");
    }
  });
}

async function onSignedIn(session){
  currentUser=session.user;
  showApp();
  setSyncStatus("Connecting…");
  await migrateLocalProjects();
  await loadProjects();

  if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);

  realtimeChannel=supabaseClient
    .channel("db-manage-projects")
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"projects",
      filter:`user_id=eq.${currentUser.id}`
    },async ()=>{
      await loadProjects();
    })
    .subscribe((status)=>{
      if(status==="SUBSCRIBED") setSyncStatus("Live sync ✓",true);
    });
}

render();
startApp();
</script>

</body></html>
